name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plugins:
    uses: ./.github/workflows/plugin.yml

  github-release:
    needs: plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Zip plugin bundles
        run: |
          set -euo pipefail
          mkdir -p release-assets
          ls -la dist || true
          find dist -maxdepth 3 -print
          for dir in dist/*; do
            [ -d "$dir" ] || continue
            name="$(basename "$dir")"
            (cd "$dir" && zip -r "$GITHUB_WORKSPACE/release-assets/${name}.zip" .)
          done
          (cd release-assets && sha256sum *.zip > SHA256SUMS.txt)
          ls -la release-assets
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.zip
            release-assets/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: release-assets
          path: release-assets/
